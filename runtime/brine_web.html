<!doctype html>
<!-- A brine program in the browser (`brine build --target web`). Serve this
     folder over HTTP (browsers don't load WebAssembly from file:// pages),
     for example with `python3 -m http.server`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brine</title>
<style>
  body { margin: 0; background: #14161a; color: #e6e6e6; font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { max-width: 60rem; margin: 0 auto; padding: 1.5rem; }
  header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; flex: 1; }
  button { font: inherit; color: inherit; background: #2a2e36; border: 1px solid #3a3f4a; border-radius: 6px; padding: 0.3rem 0.9rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  pre { margin: 0; padding: 1rem; min-height: 6rem; background: #0d0f12; border: 1px solid #2a2e36; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  .err { color: #ff8b8b; }
  .status { color: #8a93a3; }
</style>
</head>
<body>
<main>
  <header><h1>brine program</h1><button id="run" disabled>Run again</button></header>
  <pre id="out"></pre>
</main>
<script type="module">
  import { run } from "./brine.js";

  const out = document.getElementById("out");
  const again = document.getElementById("run");
  const add = (text, cls) => {
    const span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = text;
    out.append(span);
  };
  const module = WebAssembly.compileStreaming(fetch("program.wasm"));

  async function go() {
    again.disabled = true;
    out.textContent = "";
    try {
      const code = await run(await module, { stdout: (t) => add(t), stderr: (t) => add(t, "err") });
      if (code !== 0) add(`\n[exit code ${code}]`, "status");
    } catch (e) {
      add(`\n${e}`, "err");
    }
    again.disabled = false;
  }
  again.onclick = go;
  go();
</script>
</body>
</html>
